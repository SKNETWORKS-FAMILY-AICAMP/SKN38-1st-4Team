name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 의존성 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 코드 검사
        run: |
          ruff check .
          ruff format --check .
      - name: 테스트
        # 테스트 파일이 아직 없으면 pytest 가 5(수집된 테스트 없음)로 끝난다. 그 경우만 통과로 본다.
        run: python -m pytest || test $? -eq 5
